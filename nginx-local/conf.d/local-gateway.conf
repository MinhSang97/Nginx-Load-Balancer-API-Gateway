# Local Development Configuration
# Simple setup for local development

# User Service (Node.js)
upstream local_user_service {
    server backend1:3000;
}

# Product Service (Python FastAPI)
upstream local_product_service {
    server backend2:8000;
}

# Order Service (Java Spring Boot)
upstream local_order_service {
    server backend3:8080;
}

# Local Development Server
server {
    listen 80;
    server_name localhost;

    # CORS headers
    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;

    # Health check
    location /health {
        return 200 'Local API Gateway is healthy';
        add_header Content-Type text/plain;
    }

    # Development info
    location /dev-info {
        return 200 '{"status":"development","server":"localhost","timestamp":"$time_iso8601","gateway":"localhost","version":"dev-1.0.0","services":["backend1:8001","backend2:8002","backend3:8003"]}';
        add_header Content-Type application/json;
    }

    # Services status
    location /services {
        return 200 '{"services":{"backend1":"http://localhost:8001","backend2":"http://localhost:8002","backend3":"http://localhost:8003"},"gateway":"http://localhost","status":"running"}';
        add_header Content-Type application/json;
    }

    # Authentication endpoint
    location /auth/ {
        proxy_pass http://local_user_service/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # User management endpoints
    location /users/ {
        proxy_pass http://local_user_service/users/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Product management endpoints
    location /products/ {
        proxy_pass http://local_product_service/products/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Order management endpoints
    location /orders/ {
        proxy_pass http://local_order_service/orders/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API documentation
    location /docs/ {
        proxy_pass http://local_product_service/docs/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Default response
    location / {
        return 200 'Local API Gateway is running! Available endpoints: /auth/, /users/, /products/, /orders/, /docs/, /dev-info, /services';
        add_header Content-Type text/plain;
    }
}
