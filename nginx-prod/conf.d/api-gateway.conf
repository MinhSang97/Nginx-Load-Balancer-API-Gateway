# Production API Gateway Configuration
# Full security features for production

# User Service (Node.js) - Production
upstream prod_user_service {
    server backend1:3000;
    keepalive 32;
}

# Product Service (Python FastAPI) - Production
upstream prod_product_service {
    server backend2:8000;
    keepalive 32;
}

# Order Service (Java Spring Boot) - Production
upstream prod_order_service {
    server backend3:8080;
    keepalive 32;
}

# Production Server with SSL
server {
    listen 80;
    server_name apifincheck.husanenglish.online;
    
    # Redirect HTTP to HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name apifincheck.husanenglish.online;

    # SSL Configuration
    ssl_certificate /etc/letsencrypt/live/apifincheck.husanenglish.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/apifincheck.husanenglish.online/privkey.pem;
    
    # SSL Security
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # Hide server information
    server_tokens off;
    add_header Server "Secure Gateway" always;
    add_header X-Powered-By "" always;

    # Health check
    location /health {
        return 200 '{"status":"healthy","service":"api-gateway","timestamp":"$time_iso8601"}';
        add_header Content-Type application/json;
    }

    # Server info (secure)
    location /server-info {
        return 200 '{"status":"secure","gateway":"apifincheck.husanenglish.online","timestamp":"$time_iso8601","version":"prod-1.0.0","security":"enabled"}';
        add_header Content-Type application/json;
    }

    # Authentication endpoint with rate limiting
    location /auth/ {
        limit_req zone=login burst=5 nodelay;
        limit_conn conn_limit_per_ip 10;
        
        # Block suspicious patterns
        if ($request_uri ~* "\.(php|asp|jsp|py|pl|sh)$") {
            return 403;
        }
        
        proxy_pass http://prod_user_service/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }

    # User management endpoints with rate limiting
    location /users/ {
        limit_req zone=api burst=10 nodelay;
        limit_conn conn_limit_per_ip 20;
        
        # Block suspicious patterns
        if ($request_uri ~* "\.(php|asp|jsp|py|pl|sh)$") {
            return 403;
        }
        
        proxy_pass http://prod_user_service/users/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }

    # Product management endpoints
    location /products/ {
        limit_req zone=api burst=15 nodelay;
        
        proxy_pass http://prod_product_service/products/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }

    # Order management endpoints
    location /orders/ {
        limit_req zone=api burst=10 nodelay;
        
        proxy_pass http://prod_order_service/orders/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }

    # API documentation
    location /docs/ {
        proxy_pass http://prod_product_service/docs/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Default response
    location / {
        return 200 'Secure API Gateway is running! Available endpoints: /auth/, /users/, /products/, /orders/, /docs/, /health, /server-info';
        add_header Content-Type text/plain;
    }
}

# Block direct IP access
server {
    listen 80 default_server;
    listen 443 ssl default_server;
    server_name _;
    
    ssl_certificate /etc/nginx/ssl/dummy.crt;
    ssl_certificate_key /etc/nginx/ssl/dummy.key;
    
    return 444;
}
