# Production Load Balancer Configuration
# Advanced load balancing with health checks

# Load balancer upstream
upstream backend_services {
    least_conn;
    server backend1:3000 max_fails=3 fail_timeout=30s;
    server backend2:8000 max_fails=3 fail_timeout=30s;
    server backend3:8080 max_fails=3 fail_timeout=30s;
}

# Health check upstream
upstream health_check {
    server backend1:3000;
    server backend2:8000;
    server backend3:8080;
}

# Load balancer server
server {
    listen 80;
    server_name apifincheck.husanenglish.online;
    
    # Redirect to HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name apifincheck.husanenglish.online;

    # SSL Configuration
    ssl_certificate /etc/letsencrypt/live/apifincheck.husanenglish.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/apifincheck.husanenglish.online/privkey.pem;
    
    # SSL Security
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Health check endpoint
    location /lb-health {
        access_log off;
        return 200 '{"status":"healthy","service":"load-balancer","timestamp":"$time_iso8601"}';
        add_header Content-Type application/json;
    }

    # Load balancer endpoint
    location /lb/ {
        proxy_pass http://backend_services/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Health check
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
        proxy_connect_timeout 5s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
    }
}
