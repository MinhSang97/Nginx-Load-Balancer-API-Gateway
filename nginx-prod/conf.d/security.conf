# Production Security Configuration
# Additional security features

# Rate limiting zones (if not defined in main nginx.conf)
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=login:10m rate=1r/s;
limit_req_zone $binary_remote_addr zone=strict:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=burst:10m rate=20r/s;

# Connection limiting
limit_conn_zone $binary_remote_addr zone=conn_limit_per_ip:10m;
limit_conn_zone $server_name zone=conn_limit_per_server:10m;

# Block common attack patterns
map $http_user_agent $blocked_agent {
    default 0;
    ~*malicious 1;
    ~*bot 1;
    ~*scanner 1;
    ~*crawler 1;
}

# Block suspicious requests
map $request_uri $blocked_uri {
    default 0;
    ~*\.(php|asp|jsp|py|pl|sh)$ 1;
    ~*admin 1;
    ~*wp- 1;
    ~*\.env 1;
    ~*config 1;
}

# Security server block
server {
    listen 80;
    server_name _;
    
    # Block all requests to this server
    return 444;
}

server {
    listen 443 ssl;
    server_name _;
    
    ssl_certificate /etc/nginx/ssl/dummy.crt;
    ssl_certificate_key /etc/nginx/ssl/dummy.key;
    
    # Block all requests to this server
    return 444;
}
