# Docker Compose for Local Development

services:
  nginx:
    build:
      context: .
      dockerfile: Dockerfile.local
    container_name: nginx-lb-gateway-local
    ports:
      - "80:80"
    volumes:
      - ./nginx-local/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx-local/conf.d:/etc/nginx/conf.d
      - ./logs:/var/log/nginx
    environment:
      - ENV=development
      - DOMAIN=localhost
    depends_on:
      - backend1
      - backend2
      - backend3
    networks:
      - nginx-network

  backend1:
    build:
      context: ./backend1
      dockerfile: Dockerfile
    container_name: backend1-nodejs-local
    ports:
      - "8001:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
    networks:
      - nginx-network

  backend2:
    build:
      context: ./backend2
      dockerfile: Dockerfile
    container_name: backend2-python-local
    ports:
      - "8002:8000"
    environment:
      - ENV=development
      - PORT=8000
    networks:
      - nginx-network

  backend3:
    build:
      context: ./backend3
      dockerfile: Dockerfile
    container_name: backend3-java-local
    ports:
      - "8003:8080"
    environment:
      - ENV=development
      - PORT=8080
    networks:
      - nginx-network

networks:
  nginx-network:
    driver: bridge
