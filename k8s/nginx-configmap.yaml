apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: nginx-gateway
data:
  nginx.conf: |
    user nginx;
    worker_processes auto;
    error_log /var/log/nginx/error.log warn;
    pid /var/run/nginx.pid;

    events {
        worker_connections 1024;
        use epoll;
        multi_accept on;
    }

    http {
        include /etc/nginx/mime.types;
        default_type application/octet-stream;

        # Logging
        log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                        '$status $body_bytes_sent "$http_referer" '
                        '"$http_user_agent" "$http_x_forwarded_for"';

        access_log /var/log/nginx/access.log main;

        # Basic Settings
        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
        keepalive_timeout 65;
        types_hash_max_size 2048;
        client_max_body_size 16M;

        # Gzip Settings
        gzip on;
        gzip_vary on;
        gzip_proxied any;
        gzip_comp_level 6;
        gzip_types
            text/plain
            text/css
            text/xml
            text/javascript
            application/json
            application/javascript
            application/xml+rss
            application/atom+xml
            image/svg+xml;

        # Rate Limiting
        limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
        limit_req_zone $binary_remote_addr zone=login:10m rate=1r/s;
        limit_req_zone $binary_remote_addr zone=strict:10m rate=5r/s;
        limit_req_zone $binary_remote_addr zone=burst:10m rate=20r/s;
        
        # Connection limiting
        limit_conn_zone $binary_remote_addr zone=conn_limit_per_ip:10m;
        limit_conn_zone $server_name zone=conn_limit_per_server:10m;

        # Include additional configurations
        include /etc/nginx/conf.d/*.conf;
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-conf-d
  namespace: nginx-gateway
data:
  api-gateway.conf: |
    # Production API Gateway Configuration for K8s

    # User Service (Node.js) - K8s
    upstream k8s_user_service {
        server backend1-service:3000;
        keepalive 32;
    }

    # Product Service (Python FastAPI) - K8s
    upstream k8s_product_service {
        server backend2-service:8000;
        keepalive 32;
    }

    # Order Service (Java Spring Boot) - K8s
    upstream k8s_order_service {
        server backend3-service:8080;
        keepalive 32;
    }

    # Production Server with SSL
    server {
        listen 80;
        server_name apifincheck.husanenglish.online;
        
        # Redirect HTTP to HTTPS
        return 301 https://$server_name$request_uri;
    }

    server {
        listen 443 ssl http2;
        server_name apifincheck.husanenglish.online;

        # SSL Configuration (handled by cert-manager)
        # SSL certificates are automatically managed by cert-manager
        
        # SSL Security
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # Security Headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        
        # Hide server information
        server_tokens off;
        add_header Server "Secure Gateway" always;
        add_header X-Powered-By "" always;

        # Health check
        location /health {
            return 200 '{"status":"healthy","service":"api-gateway","timestamp":"$time_iso8601","cluster":"kubernetes"}';
            add_header Content-Type application/json;
        }

        # Server info (secure)
        location /server-info {
            return 200 '{"status":"secure","gateway":"apifincheck.husanenglish.online","timestamp":"$time_iso8601","version":"k8s-1.0.0","security":"enabled","cluster":"kubernetes"}';
            add_header Content-Type application/json;
        }

        # Authentication endpoint with rate limiting
        location /auth/ {
            limit_req zone=login burst=5 nodelay;
            limit_conn conn_limit_per_ip 10;
            
            proxy_pass http://k8s_user_service/auth/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
        }

        # User management endpoints with rate limiting
        location /users/ {
            limit_req zone=api burst=10 nodelay;
            limit_conn conn_limit_per_ip 20;
            
            proxy_pass http://k8s_user_service/users/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
        }

        # Product management endpoints
        location /products/ {
            limit_req zone=api burst=15 nodelay;
            
            proxy_pass http://k8s_product_service/products/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
        }

        # Order management endpoints
        location /orders/ {
            limit_req zone=api burst=10 nodelay;
            
            proxy_pass http://k8s_order_service/orders/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
        }

        # API documentation
        location /docs/ {
            proxy_pass http://k8s_product_service/docs/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Default response
        location / {
            return 200 'Kubernetes API Gateway is running! Available endpoints: /auth/, /users/, /products/, /orders/, /docs/, /health, /server-info';
            add_header Content-Type text/plain;
        }
    }

    # Block direct IP access
    server {
        listen 80 default_server;
        listen 443 ssl default_server;
        server_name _;
        
        # SSL certificates handled by cert-manager
        
        return 444;
    }
